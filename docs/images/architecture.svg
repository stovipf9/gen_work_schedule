<svg xmlns="http://www.w3.org/2000/svg" width="980" height="480" viewBox="0 0 980 480" font-family="'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0.5" y="0.5" width="979" height="479" rx="14" fill="#ffffff" stroke="#e2e8f0"/>

  <!-- title -->
  <text x="30" y="40" font-size="20" font-weight="700" fill="#0f172a">gen_work_schedule — アーキテクチャ</text>
  <text x="30" y="62" font-size="12.5" fill="#64748b">勤務表を自動生成するデスクトップアプリ（Wails / Go + Svelte・TypeScript）</text>

  <!-- section labels -->
  <text x="30" y="104" font-size="11" font-weight="700" letter-spacing="1" fill="#94a3b8">入力ファイル</text>

  <!-- input boxes -->
  <g font-size="13" fill="#0f172a">
    <rect x="28" y="118" width="176" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="116" y="141" text-anchor="middle" font-weight="600">発注情報</text>
    <text x="116" y="156" text-anchor="middle" font-size="11" fill="#64748b">.xlsx</text>

    <rect x="28" y="176" width="176" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="116" y="199" text-anchor="middle" font-weight="600">従業員データ</text>
    <text x="116" y="214" text-anchor="middle" font-size="11" fill="#64748b">.csv</text>

    <rect x="28" y="234" width="176" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="116" y="257" text-anchor="middle" font-weight="600">勤務表テンプレート</text>
    <text x="116" y="272" text-anchor="middle" font-size="11" fill="#64748b">.xlsx</text>
  </g>

  <!-- input arrows -->
  <g stroke="#64748b" stroke-width="1.6" fill="none">
    <path d="M206,141 C230,141 232,215 246,236" marker-end="url(#arrow)"/>
    <path d="M206,199 L246,270" marker-end="url(#arrow)"/>
    <path d="M206,257 C230,257 232,300 246,304" marker-end="url(#arrow)"/>
  </g>

  <!-- App container -->
  <rect x="250" y="92" width="430" height="310" rx="12" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="270" y="116" font-size="13" font-weight="700" fill="#334155">デスクトップアプリ（Wails）</text>

  <!-- Frontend -->
  <rect x="272" y="128" width="386" height="56" rx="8" fill="#e0e7ff" stroke="#a5b4fc"/>
  <text x="465" y="152" text-anchor="middle" font-size="13.5" font-weight="700" fill="#312e81">フロントエンド</text>
  <text x="465" y="170" text-anchor="middle" font-size="11.5" fill="#4338ca">Svelte / TypeScript（GUI）</text>

  <!-- bidirectional bind -->
  <line x1="465" y1="184" x2="465" y2="206" stroke="#64748b" stroke-width="1.6" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="475" y="200" font-size="10" fill="#94a3b8">Wails bindings</text>

  <!-- Backend -->
  <rect x="272" y="206" width="386" height="184" rx="8" fill="#dcfce7" stroke="#86efac"/>
  <text x="288" y="228" font-size="13" font-weight="700" fill="#14532d">バックエンド（Go）</text>
  <g font-size="12.5" fill="#065f46">
    <rect x="286" y="238" width="358" height="34" rx="6" fill="#ffffff" stroke="#86efac"/>
    <text x="465" y="260" text-anchor="middle" font-weight="600">勤務表生成ロジック（土日祝日を除外・定時想定）</text>

    <rect x="286" y="282" width="358" height="34" rx="6" fill="#ffffff" stroke="#86efac"/>
    <text x="465" y="304" text-anchor="middle" font-weight="600">ファイル選択サービス</text>

    <rect x="286" y="326" width="358" height="34" rx="6" fill="#ffffff" stroke="#86efac"/>
    <text x="465" y="348" text-anchor="middle" font-weight="600">祝日キャッシュサービス</text>
  </g>

  <!-- Output (aligned with generation-logic row) -->
  <text x="714" y="228" font-size="11" font-weight="700" letter-spacing="1" fill="#94a3b8">出力</text>
  <rect x="712" y="236" width="196" height="52" rx="8" fill="#fef9c3" stroke="#fde047"/>
  <text x="810" y="259" text-anchor="middle" font-size="13" font-weight="700" fill="#713f12">勤務表</text>
  <text x="810" y="276" text-anchor="middle" font-size="11" fill="#a16207">.xlsx（作業ごとに生成）</text>
  <!-- generation-logic -> output -->
  <line x1="680" y1="255" x2="708" y2="258" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="682" y="246" font-size="10.5" fill="#94a3b8">生成</text>

  <!-- Holiday API (aligned with cache-service row) -->
  <text x="714" y="312" font-size="11" font-weight="700" letter-spacing="1" fill="#94a3b8">外部</text>
  <rect x="712" y="320" width="196" height="52" rx="8" fill="#fae8ff" stroke="#e9d5ff"/>
  <text x="810" y="343" text-anchor="middle" font-size="13" font-weight="700" fill="#701a75">祝日API</text>
  <text x="810" y="360" text-anchor="middle" font-size="11" fill="#a21caf">holidays-jp</text>
  <!-- cache-service <-> API -->
  <line x1="680" y1="343" x2="708" y2="345" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="676" y="334" font-size="10.5" fill="#94a3b8">祝日取得</text>

  <!-- footer quality notes -->
  <line x1="30" y1="416" x2="950" y2="416" stroke="#e2e8f0"/>
  <text x="30" y="440" font-size="11.5" fill="#475569"><tspan font-weight="700" fill="#334155">設計・品質: </tspan>インターフェース+DIで責務分離 ・ ファイルシステム抽象化でテスト容易性確保 ・ 排他制御（ロック機構）</text>
  <text x="30" y="461" font-size="11.5" fill="#475569"><tspan font-weight="700" fill="#334155">テスト: </tspan>単体テストを Go(testify/mockery) と Front(Vitest) に分離 ・ C1カバレッジ計測 ・ golangci-lint / knip / devcontainer</text>
</svg>
